name: Build Windows development preview

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Install and build documentation
        run: |
          python -m pip install -r docs/requirements.txt
          python scripts/build_sphinx_docs.py
      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build one-folder application
        env:
          NEUROEPHYS_LITE_BUILD: "1"
        run: python -m PyInstaller --noconfirm --clean NeuroFlow.spec
      - name: Add first-read file
        run: Copy-Item DEVELOPMENT_PREVIEW.md dist\NeuroEphysAI\README_FIRST.md
      - name: Compress preview
        run: Compress-Archive -Path dist\NeuroEphysAI\* -DestinationPath NeuroEphysAI-Windows-x64-development-preview.zip -Force
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroEphysAI-Windows-x64-development-preview
          path: NeuroEphysAI-Windows-x64-development-preview.zip
          if-no-files-found: error
      - name: Attach tagged build to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: NeuroEphysAI-Windows-x64-development-preview.zip
