name: Build NeuroEphys AI release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install application and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          python -m pip install -r docs/requirements.txt
          python -m pip install "pyinstaller>=6.10,<7" "pytest>=8,<9" "build>=1.2,<2" "twine>=6,<7"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Install and build documentation
        run: |
          python -m pip install -r docs/requirements.txt
          python scripts/build_sphinx_docs.py
      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build and verify release artifacts
        run: powershell -ExecutionPolicy Bypass -File scripts\build_release.ps1 -SkipTests -SkipDocs
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeuroEphysAI-release
          path: release/v1.0.0/*
          if-no-files-found: error
      - name: Attach tagged build to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: release/v1.0.0/*
